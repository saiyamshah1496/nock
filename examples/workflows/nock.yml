## Example: Nock — Postgres migration safety (CLI-based, runnable as-is)
## This workflow uses the CLI directly so it works without a packaged Action.
## To use the GitHub Action instead, see `examples/workflows/nock-action.yml`.
name: Nock — Postgres migration safety (CLI)
on:
  pull_request:
    paths:
      - "migrations/**"
      - ".nock/**"
jobs:
  nock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm' }

      # Optional: fetch hosted estate (Nock Team) into file fallback before running CLI
      # Provide NOCK_TEAM_API_TOKEN in repo secrets if you enable this step.
      - name: (Optional) Download hosted estate to .nock/estate.json
        if: ${{ vars.NOCK_USE_HOSTED_ESTATE == '1' }}
        env:
          NOCK_TEAM_API_TOKEN: ${{ secrets.NOCK_TEAM_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p .nock
          curl -fsSL -H "Authorization: Bearer ${NOCK_TEAM_API_TOKEN}" \
            "https://nock.saiyamshah1496.workers.dev/v1/estate/my-repo" \
            > .nock/estate.json

      - name: Run Nock check (CLI)
        run: |
          npx @nockhq/cli@0.1.5 check \
            --sql "migrations/001.sql" \
            --estate ".nock/estate.json" \
            --policy "policy.default.yml" \
            --fail-on "red" \
            --format "json" | tee nock-verdict.json

      # Minimal PR comment example from CLI output (optional)
      - name: (Optional) Comment verdict
        if: ${{ always() && github.event.pull_request.number }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "### Nock (CLI) — see logs for JSON verdict" > body.md
          gh pr comment ${{ github.event.pull_request.number }} -F body.md

