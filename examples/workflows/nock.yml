## Example-only: Nock — Postgres migration safety
## This example assumes you have copied the packaged action into your own repo at:
##   .github/actions/nock
## or you have replaced the `uses:` line with a published action reference.
## Alternatively, you can run the CLI directly via:
##   - uses: actions/setup-node@v4
##     with: { node-version: 20 }
##   - run: corepack enable && pnpm install && pnpm -r build
##   - run: npx -y @nock/cli check --sql migrations/001.sql --stats .nock/stats.json
name: Nock — Postgres migration safety
on:
  pull_request:
    paths:
      - "migrations/**"
      - ".nock/**"
jobs:
  nock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Nock
        uses: ./.github/actions/nock
        with:
          migration-path: migrations/
          stats-path: .nock/stats.json
          policy-path: policy.default.yml
          fail-on: red
          github-token: ${{ secrets.GITHUB_TOKEN }}

