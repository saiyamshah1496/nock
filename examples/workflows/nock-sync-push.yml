## Example: Scheduled sync-stats + push to hosted API (Path B+)
name: Nock — Sync stats and push
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'pnpm' }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Run sync-stats and push
        env:
          PG_STATS_URL: ${{ secrets.PG_STATS_URL }}                # read-only replica URL
          NOCK_STATS_API_TOKEN: ${{ secrets.NOCK_STATS_API_TOKEN }}# bearer for hosted API (push + Action GET)
          NOCK_STATS_KEK: ${{ secrets.NOCK_STATS_KEK }}            # base64 32 bytes (required for prod pushes)
          # NOCK_DEV_PLAINTEXT_STATS: "1"                         # local dev only (omit in CI)
        run: |
          set -euo pipefail
          mkdir -p .nock
          node packages/cli/dist/bin/nock.js sync-stats \
            --database-url "$PG_STATS_URL" \
            --out .nock/stats.json \
            --push-url "https://nock.saiyamshah1496.workers.dev/v1/stats/my-repo" \
            --token "$NOCK_STATS_API_TOKEN"

      - name: Upload stats artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: nock-stats
          path: .nock/stats.json
          retention-days: 3
