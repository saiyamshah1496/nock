## Example: Scheduled sync-estate + push to hosted estate API (Nock Team)
name: Nock — Sync estate and push
on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch: {}
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Run sync-estate and push
        env:
          PG_ESTATE_URL: ${{ secrets.PG_ESTATE_URL }}                # read-only replica URL
          NOCK_TEAM_API_TOKEN: ${{ secrets.NOCK_TEAM_API_TOKEN }}    # bearer for hosted API (push + Action GET)
          NOCK_ESTATE_KEK: ${{ secrets.NOCK_ESTATE_KEK }}            # base64 32 bytes (required for prod pushes)
          # NOCK_DEV_PLAINTEXT_ESTATE: "1"                         # local dev only (omit in CI)
        run: |
          set -euo pipefail
          mkdir -p .nock
          npx @nockhq/cli@0.1.4 sync-estate \
            --database-url "$PG_ESTATE_URL" \
            --out .nock/estate.json \
            --push-url "https://nock.saiyamshah1496.workers.dev/v1/estate/my-repo" \
            --token "$NOCK_TEAM_API_TOKEN"

      - name: Upload estate artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: nock-estate
          path: .nock/estate.json
          retention-days: 3
