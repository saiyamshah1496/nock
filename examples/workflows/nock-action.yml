## Example: Nock — GitHub Action with hosted estate (Nock Team)
## Preferred: use the subdirectory Action via a version tag:
##   uses: saiyamshah1496/nock/packages/action@v0.1.8
## After this PR merges, cut a new tag that includes committed dist (e.g., v0.1.9)
## and pin to that instead.
##
## Alternative (not preferred): copy this action into your repo under `.github/actions/nock`
## and reference it with `uses: ./.github/actions/nock`.
name: Nock — Action (hosted estate)
on:
  pull_request:
    paths:
      - "migrations/**"
      - ".nock/**"
jobs:
  nock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Nock check (Action)
        # Prefer pinning a version tag that includes committed dist:
        uses: saiyamshah1496/nock/packages/action@v0.1.8
        # Or, if testing this PR before merge, you can pin the branch SHA:
        # uses: saiyamshah1496/nock/packages/action@<commit-sha>
        with:
          migration-path: migrations/
          # Hosted estate (Nock Team): GET last-good from hosted API
          estate-api-url: https://nock.saiyamshah1496.workers.dev/v1/estate/my-repo
          estate-api-token: ${{ secrets.NOCK_TEAM_API_TOKEN }}
          # Fallback to file when hosted is unavailable (OSS/local)
          estate-path: .nock/estate.json
          policy-path: policy.default.yml
          fail-on: red
          github-token: ${{ secrets.GITHUB_TOKEN }}
