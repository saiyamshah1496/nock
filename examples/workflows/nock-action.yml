## Example: Nock — GitHub Action with hosted estate (Nock Team)
## Preferred: use the GitHub Marketplace Action pinned to a version tag:
##   uses: saiyamshah1496/nock-action@v0.1.9
##
## Monorepo equivalent (maintainers only): saiyamshah1496/nock/packages/action@v0.1.9
## Local copy is not recommended; prefer the Marketplace Action.
name: Nock — Action (hosted estate)
on:
  pull_request:
    paths:
      - "migrations/**"
      - ".nock/**"
jobs:
  nock:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Nock check (Action)
        # Prefer pinning a version tag from the Marketplace Action:
        uses: saiyamshah1496/nock-action@v0.1.9
        # Or, if testing this PR before merge, you can pin the branch SHA:
        # uses: saiyamshah1496/nock-action@<commit-sha>
        with:
          migration-path: migrations/
          # Hosted estate (Nock Team): GET last-good from hosted API
          estate-api-url: https://nock.saiyamshah1496.workers.dev/v1/estate/my-repo
          estate-api-token: ${{ secrets.NOCK_TEAM_API_TOKEN }}
          # Fallback to file when hosted is unavailable (OSS/local)
          estate-path: .nock/estate.json
          policy-path: policy.default.yml
          fail-on: red
          github-token: ${{ secrets.GITHUB_TOKEN }}
