name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Enable corepack (prepare pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        run: pnpm -r build

      - name: Test (vitest)
        run: pnpm test

  estate-sync-integration:
    name: estate-sync-integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nock"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable corepack (prepare pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.12.2 --activate

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install system tools (psql, jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client jq

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (workspace)
        run: pnpm -r build

      - name: Seed Postgres (idempotent)
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/nock
        run: |
          echo "Waiting for Postgres to be ready..."
          for i in {1..60}; do
            if pg_isready -h localhost -p 5432 -U postgres -d nock -t 1 >/dev/null 2>&1; then
              echo "Postgres is ready."
              break
            fi
            echo "pg_isready retry $i..."
            sleep 1
          done
          echo "Seeding database using fixtures/ci-estate/seed.sql"
          psql "$PGURL" -v ON_ERROR_STOP=1 -f fixtures/ci-estate/seed.sql
          echo "Row counts:"
          psql "$PGURL" -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY n_live_tup DESC LIMIT 5;"

      - name: Sync estate from Postgres
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/nock
        run: |
          mkdir -p .nock
          node packages/cli/dist/bin/nock.js sync-estate \
            --database-url "$PGURL" \
            --out .nock/estate.json
          echo "Captured estate:"
          head -n 50 .nock/estate.json || true

      - name: Check expected RED on hot table (sessions)
        env:
          ESTATE: .nock/estate.json
        run: |
          set -euo pipefail
          # Run check once; expect red exit code; capture JSON without failing the step
          node packages/cli/dist/bin/nock.js check \
            --sql fixtures/ci-estate/create_index_nonconcurrent_sessions.sql \
            --estate "$ESTATE" \
            --format json \
            --fail-on red \
            > /tmp/nock_red.json || true
          echo "RED verdict JSON:"
          cat /tmp/nock_red.json || true
          # Assert verdict is fail and includes R001 with severity red
          test "$(jq -r '.verdict' /tmp/nock_red.json)" = "fail"
          jq -e '.violations[] | select(.rule_id=="R001" and .severity=="red")' /tmp/nock_red.json >/dev/null

      - name: Check expected PASS on tiny table (widgets)
        env:
          ESTATE: .nock/estate.json
        run: |
          set -euo pipefail
          node packages/cli/dist/bin/nock.js check \
            --sql fixtures/ci-estate/create_index_nonconcurrent_widgets.sql \
            --estate "$ESTATE" \
            --format json \
            --fail-on red \
            | tee /tmp/nock_pass.json
          echo "PASS verdict JSON:"
          cat /tmp/nock_pass.json
          test "$(jq -r '.verdict' /tmp/nock_pass.json)" = "pass"

