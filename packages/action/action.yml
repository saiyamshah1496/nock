name: "Nock — Postgres migration safety"
description: "Fail PRs on unsafe Postgres DDL using your table sizes and policy"
author: "Nock"
runs:
  using: "node20"
  main: "dist/index.js"
inputs:
  migration-path:
    description: "Path or glob for migration SQL files"
    required: false
    default: "migrations/"
  estate-path:
    description: "Path to estate.json (file mode)"
    required: false
    default: ".nock/estate.json"
  estate-api-url:
    description: "Optional: GET URL for hosted estate API (Path B+)"
    required: false
  estate-api-token:
    description: "Optional: Bearer token for hosted estate API"
    required: false
  api-base-url:
    description: "Optional: Override API base (defaults to origin from estate-api-url)"
    required: false
  policy-path:
    description: "Path to policy.yml (YAML or JSON)"
    required: false
    default: "policy.default.yml"
  fail-on:
    description: "Fail on red|yellow"
    required: false
    default: "red"
  github-token:
    description: "GitHub token for PR comments"
    required: true

