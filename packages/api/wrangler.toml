name = "nock"
main = "src/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Add non-secret vars here if desired (secrets via `wrangler secret put`)
[vars]
# NOCK_ESTATE_STORE = "r2"         # prefer; falls back to NOCK_STATS_STORE
# NOCK_DEV_PLAINTEXT_ESTATE = "1"  # prefer; falls back to NOCK_DEV_PLAINTEXT_STATS
# NOCK_AUDIT_RETENTION_DAYS = "30"

[[d1_databases]]
binding = "NOCK_D1"
database_name = "nock-team"
database_id = "e4afe7b2-48ca-47fc-9df4-a8f9a74c937f"
migrations_dir = "d1/migrations"

