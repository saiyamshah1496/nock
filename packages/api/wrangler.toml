name = "nock"
main = "src/worker.ts"
compatibility_date = "2026-09-15"
compatibility_flags = ["nodejs_compat"]

# Add non-secret vars here if desired (secrets via `wrangler secret put`)
[vars]
# NOCK_STATS_STORE = "r2"
# NOCK_DEV_PLAINTEXT_STATS = "1"
# NOCK_AUDIT_RETENTION_DAYS = "30"

## Example D1 binding (fill values in your own deploy config)
## Do not commit real database_id; keep as example only.
[[d1_databases]]
binding = "NOCK_D1"
database_name = "nock-team"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "d1/migrations"

