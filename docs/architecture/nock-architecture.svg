<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nock architecture (v0.1.x)</title>
  <desc id="desc">GitHub-safe SVG: simple boxes, lines, and text labels. No style/script blocks. ASCII arrows in labels.</desc>

  <!-- Title -->
  <text x="800" y="60" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="28"
        fill="#111827">Nock architecture (v0.1.x)</text>

  <!-- Surfaces -->
  <rect x="80" y="160" width="340" height="210" rx="8"
        fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="96" y="188" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#111827">Surfaces (left)</text>
  <text x="96" y="222" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">" CLI (@nockhq/cli)</text>
  <text x="96" y="246" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">" GitHub Action</text>
  <text x="96" y="270" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">" MCP (@nockhq/mcp)</text>
  <text x="96" y="294" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">" GitHub App (DDL Gate)</text>

  <!-- Core -->
  <rect x="560" y="160" width="460" height="220" rx="8"
        fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="576" y="188" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#111827">Core: @nockhq/core engine</text>
  <text x="576" y="224" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">parse/classify DDL -&gt; estate context -&gt; policy/rules (R00x)</text>
  <text x="576" y="248" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">-&gt; verdict JSON (never applies migrations)</text>

  <!-- Estate inputs -->
  <rect x="80" y="440" width="340" height="280" rx="8"
        fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="96" y="468" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#111827">Estate inputs</text>
  <text x="96" y="500" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">Path A: committed estate.json / paste</text>
  <text x="96" y="524" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">Path B: nock sync-estate (read-only) -&gt; file</text>
  <text x="96" y="548" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">Path B+: push encrypted estate to hosted API (Team)</text>
  <text x="96" y="584" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">Live refresh: --database-url / MCP databaseUrl</text>
  <text x="96" y="608" font-family="Arial, Helvetica, sans-serif"
        font-size="14" fill="#6b7280">(client-side catalogue refresh, check-only; free path)</text>

  <!-- Hosted Team (Cloudflare) -->
  <rect x="1120" y="160" width="460" height="260" rx="8"
        fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="1136" y="188" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#111827">Hosted Team (Cloudflare)</text>
  <text x="1136" y="220" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">Worker (Hono)</text>
  <text x="1136" y="244" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">D1 (orgs/tokens, policy knobs, audit)</text>
  <text x="1136" y="268" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">R2 (encrypted estate blobs)</text>
  <text x="1136" y="292" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">org API token auth</text>

  <!-- Outputs -->
  <rect x="1120" y="520" width="460" height="170" rx="8"
        fill="#f3f4f6" stroke="#111827" stroke-width="2"/>
  <text x="1136" y="548" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#111827">Outputs</text>
  <text x="1136" y="580" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">pass / fail / yellow verdict + remediation hints</text>
  <text x="1136" y="604" font-family="Arial, Helvetica, sans-serif"
        font-size="16" fill="#111827">-&gt; CI check / PR comment / MCP to agent</text>

  <!-- Notes -->
  <text x="800" y="500" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="14"
        fill="#6b7280">Postgres-only v1 " check-only (never APPLY) " same engine everywhere</text>

  <!-- Connectors (plain lines + ASCII labels nearby) -->
  <!-- Surfaces -> Core -->
  <line x1="420" y1="265" x2="560" y2="265" stroke="#6b7280" stroke-width="2"/>
  <text x="490" y="258" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">-&gt;</text>

  <!-- Estate (A/B) -> Core -->
  <line x1="420" y1="540" x2="560" y2="540" stroke="#6b7280" stroke-width="2"/>
  <text x="480" y="520" font-family="Arial, Helvetica, sans-serif"
        font-size="12" fill="#6b7280">Path A / B -&gt;</text>

  <!-- Estate (B+) -> Team (dashed effect) -->
  <line x1="420" y1="600" x2="1120" y2="600" stroke="#6b7280" stroke-width="2"
        stroke-dasharray="6 6"/>
  <text x="770" y="590" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Path B+: push encrypted estate to hosted API -&gt;</text>

  <!-- Core -> Outputs -->
  <line x1="1020" y1="420" x2="1120" y2="520" stroke="#6b7280" stroke-width="2"/>
  <text x="1080" y="450" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">-&gt;</text>

  <!-- Live refresh label -->
  <text x="720" y="300"
        font-family="Arial, Helvetica, sans-serif" font-size="12"
        fill="#6b7280">Live refresh (--database-url / MCP databaseUrl)</text>
</svg>
